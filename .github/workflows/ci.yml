name: CI
# Builds only what this fork changes: the SCUMM engine with the Neuro-sama
# integration. Every build is kept as a downloadable package, and a tag
# named neuro-v* publishes the packages as a release.
on:
  push:
    branches: [neuro]
    tags: ['neuro-v*']
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  linux:
    name: Linux
    runs-on: ubuntu-24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install packages
        run: |
          sudo apt-get update
          sudo apt-get install libcurl4-openssl-dev libflac-dev libfreetype6-dev libmad0-dev libogg-dev libpng-dev libsdl2-dev libsdl2-net-dev libvorbis-dev zlib1g-dev
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: linux
          max-size: 500M
      - name: Call configure
        run: |
          CXX='ccache g++' ./configure --disable-all-engines --enable-engine=scumm,neuro --enable-release
      - name: Build scummvm
        run: |
          make -j4
      - name: Package
        run: |
          name=neuro-scumm-${GITHUB_REF_NAME//\//-}-linux-x64
          mkdir "$name"
          strip -o "$name/scummvm" scummvm
          cp -r neuro COPYING README.md "$name/"
          cp neuro/dist/console.sh "$name/"
          cp neuro/dist/README-linux.txt "$name/README-linux.txt"
          rm -rf "$name/neuro/dist"
          tar czf "$name.tar.gz" "$name"
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: linux-x64
          path: neuro-scumm-*-linux-x64.tar.gz
  windows:
    name: Windows
    runs-on: windows-2022
    env:
      CONFIGURATION: Release
      PLATFORM: x64
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_INSTALLED_DIR: ${{ github.workspace }}/vcpkg_installed
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg_cache,readwrite
      VCPKG_OVERLAY_PORTS: ${{ github.workspace }}/.github/vcpkg-ports
      GIT_VCPKG_COMMIT: 9e593bb18ea69cc5095e012465dcd675a822ed0d
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Install vcpkg
        uses: lukka/run-vcpkg@v11
        id: runvcpkg
        with:
          vcpkgGitCommitId: ${{ env.GIT_VCPKG_COMMIT }}
      - name: Integrate vcpkg
        run: |
          ${{ steps.runvcpkg.outputs.RUNVCPKG_VCPKG_ROOT_OUT }}/vcpkg integrate install
      - name: Restore vcpkg cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-${{ env.GIT_VCPKG_COMMIT }}-x64-windows-${{ hashFiles('vcpkg.json') }}
          restore-keys: vcpkg-${{ env.GIT_VCPKG_COMMIT }}-x64-windows-
      - name: Build create_project
        run: |
          cd devtools/create_project/cmake
          cmake .
          cmake --build . -j 2
      - name: Call create_project
        run: |
          mkdir build-scummvm
          cd build-scummvm
          ../devtools/create_project/cmake/Debug/create_project.exe .. --msvc --vcpkg --disable-all-engines --enable-engine=scumm,neuro
      - name: Add msbuild to PATH
        uses: microsoft/setup-msbuild@v2
      - name: Install vcpkg packages
        run: |
          vcpkg install
      - name: Save vcpkg cache
        uses: actions/cache/save@v4
        with:
          path: ${{ github.workspace }}/vcpkg_cache
          key: vcpkg-${{ env.GIT_VCPKG_COMMIT }}-x64-windows-${{ hashFiles('vcpkg.json') }}
      - name: Build scummvm
        run: |
          cd build-scummvm
          msbuild scummvm.sln /m /p:VcpkgEnableManifest=true /p:BuildInParallel=true /p:Configuration=${{ env.CONFIGURATION }} /p:PreferredToolArchitecture=x64 /p:Platform=x64 /v:minimal
      - name: Package
        shell: pwsh
        run: |
          $name = "neuro-scumm-$($env:GITHUB_REF_NAME -replace '/', '-')-windows-x64"
          New-Item -ItemType Directory $name | Out-Null
          $exe = Get-ChildItem -Recurse build-scummvm -Filter scummvm.exe | Select-Object -First 1
          if (-not $exe) { throw "scummvm.exe was not built" }
          Copy-Item $exe.FullName $name
          # The libraries it needs: those the build put beside it, and the rest from vcpkg
          Copy-Item (Join-Path $exe.DirectoryName '*.dll') $name -ErrorAction SilentlyContinue
          Get-ChildItem "$env:VCPKG_INSTALLED_DIR/x64-windows/bin" -Filter *.dll | ForEach-Object {
            if (-not (Test-Path (Join-Path $name $_.Name))) { Copy-Item $_.FullName $name }
          }
          Copy-Item -Recurse neuro $name
          Copy-Item COPYING, README.md $name
          Copy-Item neuro/dist/console.bat $name
          Copy-Item neuro/dist/README-windows.txt $name
          Remove-Item -Recurse "$name/neuro/dist"
          Compress-Archive -Path $name -DestinationPath "$name.zip"
      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: windows-x64
          path: neuro-scumm-*-windows-x64.zip
  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/neuro-v')
    needs: [linux, windows]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download packages
        uses: actions/download-artifact@v4
        with:
          merge-multiple: true
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "$GITHUB_REF_NAME" neuro-scumm-* \
            --title "${GITHUB_REF_NAME#neuro-v}" \
            --notes "Unpack, then run console.bat (Windows) or console.sh (Linux). You need your own copy of The Secret of Monkey Island: Special Edition, Python 3.9 or newer, and a Neuro API server to connect to. See the README inside the package."
