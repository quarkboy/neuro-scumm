<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Description Review</title>
<style>
:root {
	--bg: #f6f5f2; --panel: #ffffff; --text: #1d1d1b; --muted: #6b6a66; --line: #dddbd5;
	--accent: #2f6fb3; --object: #4f9cf0; --actor: #f08a4b; --hidden: #a8a59e; --hot: #ffd400;
	--ok: #2e7d32; --warn: #b26a00; --todo: #8a8780; --goal: #7b3fb3; --clue: #0d7d6c;
}
@media (prefers-color-scheme: dark) {
	:root { --bg: #161615; --panel: #201f1d; --text: #ecebe7; --muted: #a09e98; --line: #3a3935;
		--accent: #6fa8e8; --ok: #6cc070; --warn: #e0a040; --todo: #8a8780; --goal: #c08cf0; --clue: #4fd0b8; }
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.45 system-ui, sans-serif;
	display: grid; grid-template-columns: 210px minmax(0, 1.2fr) minmax(420px, 1fr); }

nav { border-right: 1px solid var(--line); overflow-y: auto; background: var(--panel); }
nav .filters { padding: 8px; border-bottom: 1px solid var(--line); display: flex; gap: 4px; flex-wrap: wrap; position: sticky; top: 0; background: var(--panel); z-index: 1; }
nav button.room { display: flex; width: 100%; text-align: left; gap: 8px; padding: 5px 10px; border: 0; background: none; color: inherit; font: inherit; cursor: pointer; align-items: baseline; }
nav button.room:hover { background: var(--bg); }
nav button.room.current { background: var(--accent); color: #fff; }
nav .num { font-variant-numeric: tabular-nums; color: var(--muted); width: 2.2em; flex: none; }
nav button.current .num { color: #fff; }
nav .label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex: none; align-self: center; background: var(--todo); }
.dot.checked { background: var(--ok); } .dot.needs-work { background: var(--warn); } .dot.draft { background: var(--accent); }
.dot.none { background: transparent; border: 1px solid var(--todo); }

#picturePane { height: 100vh; overflow: auto; background: #000; position: relative; color: #aaa; }
.toolbar { position: sticky; top: 0; left: 0; z-index: 2; display: flex; gap: 6px; align-items: center; flex-wrap: wrap;
	padding: 8px 10px; background: rgba(0, 0, 0, 0.75); color: #ddd; font-size: 13px; }
.toolbar .info { margin-left: auto; color: #aaa; }
.frame { position: relative; display: inline-block; vertical-align: top; }
.frame.fit { display: block; width: 100%; }
.frame img { display: block; image-rendering: pixelated; }
.frame.fit img { width: 100%; height: auto; }
.frame svg { position: absolute; inset: 0; width: 100%; height: 100%; }
.box { fill: rgba(0, 0, 0, 0); stroke: var(--object); stroke-width: 1.5; vector-effect: non-scaling-stroke; cursor: pointer; pointer-events: all; }
.box.hidden { stroke: var(--hidden); stroke-dasharray: 3 3; }
.box:hover, .box.hot { fill: rgba(255, 212, 0, 0.25); stroke: var(--hot); stroke-width: 3; }
.marker { fill: var(--actor); stroke: #000; stroke-width: 1; vector-effect: non-scaling-stroke; cursor: pointer; pointer-events: all; }
.marker.hot, .marker:hover { fill: var(--hot); }
#tooltip { position: fixed; pointer-events: none; background: #111; color: #fff; padding: 3px 7px; border-radius: 4px; font-size: 12px; display: none; z-index: 5; white-space: nowrap; }
.nopicture { padding: 24px; }

main { overflow-y: auto; height: 100vh; border-left: 1px solid var(--line); }
.tabs { display: flex; gap: 2px; position: sticky; top: 0; background: var(--bg); padding: 8px 18px 0; border-bottom: 1px solid var(--line); z-index: 3; }
.tabs button { border: 1px solid var(--line); border-bottom: 0; background: var(--panel); color: var(--muted); padding: 6px 14px; border-radius: 6px 6px 0 0; font: inherit; cursor: pointer; }
.tabs button.on { color: var(--text); font-weight: 600; background: var(--bg); position: relative; top: 1px; }
#view { padding: 14px 18px 60px; }
h1 { font-size: 17px; margin: 0 0 2px; } .sub { color: var(--muted); margin-bottom: 12px; font-size: 13px; }
h3 { margin: 18px 0 4px; font-size: 14px; }
form.stack, .stack { display: grid; gap: 10px; }
label { display: grid; gap: 3px; font-weight: 600; font-size: 13px; }
label.inline { display: flex; align-items: center; gap: 5px; font-weight: 400; }
input, textarea, select { font: inherit; padding: 5px 8px; border: 1px solid var(--line); border-radius: 5px; background: var(--panel); color: var(--text); width: 100%; }
input[type=checkbox] { width: auto; }
textarea { min-height: 110px; resize: vertical; } textarea.short { min-height: 54px; }
.row { display: flex; gap: 10px; align-items: end; } .row > label { flex: 1; }
table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 3px 4px; border-bottom: 1px solid var(--line); vertical-align: middle; }
td.id { font-variant-numeric: tabular-nums; color: var(--muted); width: 3.2em; }
td.name { width: 34%; }
tr.hidden td.name { color: var(--hidden); text-decoration: line-through; }
tr.hot { background: color-mix(in srgb, var(--hot) 28%, transparent); }
.savebar { display: flex; align-items: center; gap: 10px; padding-top: 6px; }
button.primary { background: var(--accent); color: #fff; border: 0; border-radius: 5px; padding: 7px 14px; font: inherit; font-weight: 600; cursor: pointer; }
button.small { border: 1px solid #555; background: #222; color: #ddd; border-radius: 5px; padding: 2px 8px; font: inherit; font-size: 12px; cursor: pointer; }
button.small.on { background: var(--accent); color: #fff; border-color: var(--accent); }
nav button.small, main button.small { border-color: var(--line); background: var(--panel); color: inherit; }
nav button.small.on, main button.small.on { background: var(--accent); color: #fff; border-color: var(--accent); }
button.danger { color: #c62828; }
.saved { color: var(--ok); } .other { color: var(--muted); font-size: 12px; white-space: pre-wrap; }
.note { color: var(--muted); font-size: 12px; font-style: italic; }

/* Lines */
.linefilters { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; margin-bottom: 8px; }
.linefilters input[type=search] { flex: 1; min-width: 140px; }
.linefilters select { width: auto; }
.group { margin-top: 14px; font-size: 12px; font-weight: 600; color: var(--muted); border-bottom: 1px solid var(--line); padding-bottom: 2px; }
.line { display: grid; grid-template-columns: 34px 120px 1fr; gap: 8px; padding: 4px 4px; border-bottom: 1px solid var(--line); cursor: pointer; align-items: start; }
.line:hover { background: var(--panel); }
.line.open { background: var(--panel); border-bottom: 0; }
.swatch { width: 30px; height: 20px; border-radius: 3px; border: 1px solid var(--line); font-size: 10px; display: grid; place-items: center; color: #fff; text-shadow: 0 0 2px #000, 0 0 2px #000; }
.swatch.likely { border: 2px dashed var(--warn); }
.swatch.unknown { background: repeating-linear-gradient(45deg, var(--line), var(--line) 3px, transparent 3px, transparent 6px); color: var(--muted); text-shadow: none; }
.speaker { font-size: 12px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; padding-top: 1px; }
.speaker.guess { color: var(--warn); font-style: italic; }
.speaker.set { font-weight: 600; }
.kind { font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 3px; padding: 0 4px; margin-right: 5px; }
.badge { display: inline-block; font-size: 11px; border-radius: 3px; padding: 0 5px; margin-left: 5px; color: #fff; background: var(--goal); }
.badge.clue { background: var(--clue); } .badge.subst { background: var(--warn); }
.editor { grid-column: 1 / -1; padding: 10px 10px 14px; border: 1px solid var(--line); border-top: 0; background: var(--panel); margin-bottom: 6px; display: grid; gap: 12px; cursor: default; }
.editor h4 { margin: 0; font-size: 13px; }
.editor .pair { display: grid; grid-template-columns: 1fr auto; gap: 6px; align-items: end; }
.pair { display: flex; gap: 6px; align-items: end; } .pair > label, .pair > span, .pair > input { flex: 1; min-width: 0; } .pair > select { max-width: 48%; }
.card { border: 1px solid var(--line); border-radius: 6px; padding: 10px; background: var(--panel); display: grid; gap: 8px; margin-bottom: 8px; }
.card .head { display: flex; justify-content: space-between; align-items: center; font-weight: 600; }

.editor .pair > span, .trigger { min-width: 0; }

/* Folding lists */
.searchbar { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; position: sticky; top: 38px; z-index: 2; background: var(--bg); padding: 8px 0; }
.searchbar input[type=search] { flex: 1; min-width: 160px; }
.searchbar .count { color: var(--muted); font-size: 12px; flex-basis: 100%; }
details.fold { border: 1px solid var(--line); border-radius: 6px; background: var(--panel); margin-bottom: 5px; }
details.fold > summary { cursor: pointer; padding: 6px 10px; display: flex; gap: 8px; align-items: baseline; list-style: none; }
details.fold > summary::-webkit-details-marker { display: none; }
details.fold > summary::before { content: "▸"; color: var(--muted); flex: none; }
details.fold[open] > summary::before { content: "▾"; }
details.fold[open] > summary { border-bottom: 1px solid var(--line); }
details.fold > summary:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); }
summary .what { font-weight: 600; flex: none; max-width: 55%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
summary .gist { color: var(--muted); font-size: 12px; flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
summary .tag { flex: none; font-size: 11px; color: var(--muted); border: 1px solid var(--line); border-radius: 9px; padding: 0 7px; white-space: nowrap; }
summary .tag.goal { color: var(--goal); border-color: var(--goal); } summary .tag.clue { color: var(--clue); border-color: var(--clue); }
.foldbody { padding: 10px; display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); }
.foldbody details.fold { background: var(--bg); margin-bottom: 0; }
.foldbody h4 { margin: 6px 0 0; font-size: 12px; color: var(--muted); }
.fields { display: grid; gap: 8px; grid-template-columns: minmax(0, 1fr); }
.fields .cols { display: grid; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); gap: 8px; align-items: end; }
.help { color: var(--muted); font-size: 12px; margin: 2px 0 8px; }
.addrow { display: flex; gap: 6px; margin: 6px 0 4px; } .addrow input { max-width: 260px; }
.rows { display: grid; gap: 4px; } .rows .r { display: flex; gap: 4px; align-items: center; } .rows .r > * { min-width: 0; }
.rows .heads { font-size: 11px; color: var(--muted); }
.roomrow { display: flex; gap: 8px; align-items: baseline; padding: 4px 6px; border-bottom: 1px solid var(--line); cursor: pointer; flex-wrap: wrap; }
.roomrow:hover { background: var(--panel); }
.chip { font-size: 11px; border-radius: 9px; padding: 0 7px; border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
details.group { border-top: 1px solid var(--line); padding-top: 6px; }
details.group > summary { cursor: pointer; font-weight: 600; font-size: 14px; padding: 2px 0; }
details.group > summary .n { color: var(--muted); font-weight: 400; font-size: 12px; margin-left: 6px; }
details.group > .inner { display: grid; gap: 8px; padding: 6px 0 4px; }
th { font-size: 11px; color: var(--muted); font-weight: 400; }
td.tick { width: 2.4em; text-align: center; }
.spot { fill: #4fd0b8; stroke: #000; stroke-width: 1; vector-effect: non-scaling-stroke; pointer-events: all; }
.picking, .picking * { cursor: crosshair !important; }
#toast { position: fixed; bottom: 18px; right: 18px; background: var(--ok); color: #fff; padding: 7px 14px; border-radius: 6px; display: none; z-index: 9; font-weight: 600; }

@media (max-width: 1000px) {
	body { grid-template-columns: 1fr; grid-template-rows: auto auto 1fr; height: auto; }
	nav { max-height: 30vh; } #picturePane { height: auto; max-height: 45vh; } main { height: auto; }
}
</style>
</head>
<body>
<nav>
	<div class="filters" id="filters"></div>
	<div id="list"></div>
</nav>
<section id="picturePane"></section>
<main>
	<div class="tabs" id="tabs"></div>
	<div id="view"><p>Loading…</p></div>
</main>
<div id="tooltip"></div>
<div id="toast"></div>
<script>
const STATUSES = ["", "draft", "needs-work", "checked"];
const STATUS_LABEL = { "": "not written", draft: "draft", "needs-work": "needs work", checked: "checked" };
const EGA = ["#000000", "#0000aa", "#00aa00", "#00aaaa", "#aa0000", "#aa00aa", "#aa5500", "#aaaaaa", "#555555", "#5555ff", "#55ff55", "#55ffff", "#ff5555", "#ff55ff", "#ffff55", "#ffffff"];
const EMPTY_JOURNAL = { goals: [], clues: [], lines: [], nudges: [], alerts: [], watches: [], linenotes: [], rooms: {},
	states: { keys: {}, comment: "" }, game: { keys: {}, comment: "" }, actors: { keys: {}, comment: "" } };
let rooms = [], roomById = new Map(), lineRooms = {}, lines = [], journal = EMPTY_JOURNAL;
let roomIds = [], current = 0, filter = "all", zoom = "fit", showHidden = false, view = "room";
let lineFilter = { search: "", kind: "say", unattributed: false, marked: false }, openLine = null;
let picking = null;
const openFolds = new Set(), journalSearch = { q: "" }, otherSearch = { q: "" };
const tooltip = document.getElementById("tooltip"), toast = document.getElementById("toast");

function el(tag, attrs = {}, ...children) {
	const node = document.createElement(tag);
	for (const [k, v] of Object.entries(attrs)) {
		if (k.startsWith("on")) node.addEventListener(k.slice(2), v);
		else if (k === "value" && tag !== "option") node.value = v ?? "";
		else if (v !== false && v != null) node.setAttribute(k, v === true ? "" : v);
	}
	node.append(...children.flat().filter(c => c !== null && c !== undefined && c !== "" && c !== false));
	return node;
}
function svgEl(tag, attrs) {
	const node = document.createElementNS("http://www.w3.org/2000/svg", tag);
	for (const [k, v] of Object.entries(attrs)) node.setAttribute(k, v);
	return node;
}
async function post(url, body) {
	const res = await fetch(url, { method: "POST", body: JSON.stringify(body) });
	if (!res.ok) alert("Save failed: " + (await res.text()));
	return res.ok;
}
const saveSection = (section, set, more = {}) => post("api/section", { section, set, ...more });
const deleteSection = section => post("api/section", { section, delete: true });
let toastTimer;
function flash(text) {
	toast.textContent = text; toast.style.display = "block";
	clearTimeout(toastTimer); toastTimer = setTimeout(() => toast.style.display = "none", 1800);
}

/** A room's section, sorted into the kinds of key the page edits. */
const ROOM_PLAIN = ["name", "description", "status", "review_note", "prompt", "layout", "relative", "comings", "passages"];
function parseRoom({ keys, comment }) {
	const ini = { keys, comment, objects: {}, names: {}, actors: {}, scenery: [], voices: [], spots: [], standing: [], other: {} };
	for (const key of ROOM_PLAIN) ini[key] = keys[key] || "";
	for (const [k, v] of Object.entries(keys)) {
		let m;
		if (ROOM_PLAIN.includes(k)) continue;
		if ((m = /^object\.(\d+)$/.exec(k))) ini.objects[m[1]] = v;
		else if ((m = /^scenery\.(\d+)\.(\d+)$/.exec(k))) ini.scenery.push({ object: m[1], state: m[2], text: v });
		else if ((m = /^name\.(\d+)$/.exec(k))) ini.names[m[1]] = v;
		else if ((m = /^actor\.(\d+)$/.exec(k))) ini.actors[m[1]] = v;
		else if ((m = /^voice\.(?:(\d+)\.)?(\d+)$/.exec(k))) ini.voices.push({ color: m[2], actor: m[1] || "", name: v });
		else if (k.startsWith("spot.")) {
			const bar = v.indexOf("|"), where = bar < 0 ? v : v.slice(0, bar), [x, y] = where.replace("twice", "").split(",");
			ini.spots.push({ name: k.slice(5), x: (x || "").trim(), y: (y || "").trim(), twice: where.includes("twice") ? "twice" : "", text: bar < 0 ? "" : v.slice(bar + 1).trim() });
		} else if (k.startsWith("standing.")) {
			const bar = v.indexOf("|");
			ini.standing.push({ name: k.slice(9), boxes: (bar < 0 ? v : v.slice(0, bar)).trim(), text: bar < 0 ? "" : v.slice(bar + 1).trim() });
		} else ini.other[k] = v;
	}
	return ini;
}
/** What is unusual about a room's section, as short labels. */
function roomExtras(keys) {
	const count = test => Object.entries(keys).filter(([k, v]) => test(k, v)).length, out = [];
	const add = (n, one, many) => { if (n) out.push(n === 1 ? one : `${n} ${many}`); };
	add(count((k, v) => /^name\.\d+$/.test(k) && !v), "1 thing hidden", "things hidden");
	add(count((k, v) => /^name\.\d+$/.test(k) && v), "1 thing renamed", "things renamed");
	add(count((k, v) => /^actor\.\d+$/.test(k) && !v), "1 actor hidden", "actors hidden");
	add(count(k => k.startsWith("voice.")), "1 voice", "voices");
	add(count(k => k.startsWith("scenery.")), "1 scenery sentence", "scenery sentences");
	add(count(k => k.startsWith("spot.")), "1 place to walk to", "places to walk to");
	add(count(k => k.startsWith("standing.")), "1 standing place", "standing places");
	if (keys.passages) out.push("passages");
	if (keys.prompt) out.push("own dialogue prompt");
	if (keys.layout) out.push(`layout: ${keys.layout}`);
	if (keys.relative) out.push("left/right of Guybrush");
	if (keys.comings) out.push(`comings: ${keys.comings}`);
	return out;
}

async function fetchAll() {
	const [r, j] = await Promise.all([fetch("api/rooms"), fetch("api/journal")]);
	rooms = await r.json();
	rooms.forEach(room => room.ini = parseRoom(room.ini));
	roomById = new Map(rooms.map(room => [room.room, room]));
	journal = { ...EMPTY_JOURNAL, ...(await j.json()) };
}
async function load() {
	const [, l] = await Promise.all([fetchAll(), fetch("api/lines")]);
	const lineData = await l.json();
	lineRooms = lineData.rooms; lines = lineData.lines;
	lines.forEach((line, i) => line.index = i);
	const ids = new Set([...rooms.map(room => room.room), ...Object.keys(lineRooms).map(Number)]);
	if (lines.some(line => line.room === 0)) ids.add(0);
	roomIds = [...ids].sort((a, b) => a - b);
	const fromHash = parseInt(location.hash.slice(1));
	current = roomIds.includes(fromHash) ? fromHash : (roomIds.find(id => id > 0) ?? 0);
	renderFilters(); renderList(); render();
}
async function reloadJournal() { journal = { ...EMPTY_JOURNAL, ...(await (await fetch("api/journal")).json()) }; }

function roomName(id) {
	if (id === 0) return "Scripts used everywhere";
	return roomById.get(id)?.ini.name || journal.rooms[id]?.name || "";
}
function roomStatus(id) { return roomById.get(id)?.ini.status || ""; }

function renderFilters() {
	document.getElementById("filters").replaceChildren(...["all", ...STATUSES].map(s => el("button", {
		class: "small" + (filter === s ? " on" : ""),
		onclick: () => { filter = s; renderFilters(); renderList(); },
	}, s === "all" ? `all ${roomIds.length}` : `${STATUS_LABEL[s]} ${roomIds.filter(id => roomById.has(id) && roomStatus(id) === s).length}`)));
}
function renderList() {
	const shown = roomIds.filter(id => filter === "all" || (roomById.has(id) && roomStatus(id) === filter));
	document.getElementById("list").replaceChildren(...shown.map(id => el("button", {
		class: "room" + (id === current ? " current" : ""), onclick: () => go(id),
	}, el("span", { class: "dot " + (roomById.has(id) ? roomStatus(id) : "none") }), el("span", { class: "num" }, id || "·"),
		el("span", { class: "label" }, roomName(id) || "—"))));
	document.querySelector("nav button.current")?.scrollIntoView({ block: "nearest" });
}
function go(id, toView) {
	if (!roomIds.includes(id)) return;
	current = id; openLine = null; picking = null;
	if (toView) view = toView;
	history.replaceState(null, "", "#" + id);
	renderList(); render();
}
function step(delta) {
	const i = roomIds.indexOf(current) + delta;
	if (i >= 0 && i < roomIds.length) go(roomIds[i]);
}

function render() {
	const counts = lines.filter(line => line.room === current && line.op === "say").length;
	const others = journal.alerts.length + journal.watches.length + journal.linenotes.length + journal.lines.length;
	const tabs = [["room", "Room"], ["lines", `Lines (${counts})`],
		["journal", `Goals and clues (${journal.goals.length + journal.clues.length})`], ["other", `Alerts and rules (${others})`]];
	document.getElementById("tabs").replaceChildren(...tabs.map(([key, label]) =>
		el("button", { class: view === key ? "on" : "", onclick: () => { view = key; render(); } }, label)));
	renderPicture();
	({ room: renderRoom, lines: renderLines, journal: renderJournal, other: renderOther })[view]();
}

/* ---------- picture ---------- */
function highlight(key, on) { document.querySelectorAll(`[data-thing="${key}"]`).forEach(n => n.classList.toggle("hot", on)); }
function focusEntry(key) {
	const input = document.getElementById(key);
	if (!input) return;
	input.closest("tr").scrollIntoView({ block: "center", behavior: "smooth" });
	input.focus({ preventScroll: true });
}
function hover(node, key, text) {
	node.addEventListener("mouseenter", () => { highlight(key, true); tooltip.textContent = text; tooltip.style.display = "block"; });
	node.addEventListener("mousemove", e => { tooltip.style.left = e.clientX + 12 + "px"; tooltip.style.top = e.clientY + 12 + "px"; });
	node.addEventListener("mouseleave", () => { highlight(key, false); tooltip.style.display = "none"; });
	node.addEventListener("click", () => { if (view !== "room") { view = "room"; render(); } focusEntry(key); });
}
function shownObjects(r) {
	return r.objects.filter(o => showHidden || (o.name && !o.untouchable) || o.id in r.ini.objects || o.id in r.ini.names);
}
const captureChoice = new Map();
function selectedCapture(room) {
	return room.captures.find(c => c.image === captureChoice.get(room.room)) || room.captures[0];
}
function renderPicture() {
	const pane = document.getElementById("picturePane"), room = roomById.get(current);
	const r = room && { ...selectedCapture(room), ini: room.ini };
	pane.classList.toggle("picking", !!picking);
	if (!r) {
		pane.replaceChildren(el("div", { class: "nopicture" }, current === 0
			? "These scripts are not tied to one room: Guybrush's stock replies, the inventory, and scenes that run in several places."
			: "No picture was captured for this room."));
		return;
	}
	const fit = zoom === "fit";
	const frame = el("div", { class: "frame" + (fit ? " fit" : "") });
	const img = el("img", { src: r.image, alt: `Room ${r.room}`, ...(fit ? {} : { width: r.width * zoom, height: r.height * zoom }) });
	const svg = svgEl("svg", { viewBox: `${r.origin || 0} 0 ${r.width} ${r.height}`, preserveAspectRatio: "none" });
	for (const o of [...shownObjects(r)].sort((a, b) => b.w * b.h - a.w * a.h)) {
		const hidden = o.untouchable || r.ini.names[o.id] === "";
		const box = svgEl("rect", { x: o.x, y: o.y, width: Math.max(o.w, 2), height: Math.max(o.h, 2), class: "box" + (hidden ? " hidden" : ""), "data-thing": "o" + o.id });
		hover(box, "o" + o.id, `${r.ini.names[o.id] || o.name || "(no name)"} · object ${o.id}${r.ini.names[o.id] === "" ? " · hidden from her" : ""}`);
		svg.append(box);

	for (const a of r.actors) {
		const dot = svgEl("circle", { cx: a.x, cy: a.y, r: 4, class: "marker", "data-thing": "a" + a.id });

		mark.addEventListener("mouseenter", () => { tooltip.textContent = `${s.name} · a place she can walk to (${s.x},${s.y})`; tooltip.style.display = "block"; });
		mark.addEventListener("mousemove", e => { tooltip.style.left = e.clientX + 12 + "px"; tooltip.style.top = e.clientY + 12 + "px"; });
		mark.addEventListener("mouseleave", () => tooltip.style.display = "none");
		svg.append(mark);
	}
	frame.append(img, svg);
	// Choosing a point for a place to walk to: the next click on the picture gives its coordinates
	frame.addEventListener("click", e => {
		if (!picking) return;
		e.stopPropagation();
		const b = img.getBoundingClientRect();
		picking.x.value = (r.origin || 0) + Math.round((e.clientX - b.left) / b.width * r.width);
		picking.y.value = Math.round((e.clientY - b.top) / b.height * r.height);
		picking = null; pane.classList.remove("picking");

	pane.replaceChildren(el("div", { class: "toolbar" }, ...["fit", 2, 3, 4].map(zoomButton),
		el("button", { class: "small" + (showHidden ? " on" : ""), type: "button", title: "Also show things with no name and things the game does not let her touch", onclick: () => { showHidden = !showHidden; renderPicture(); document.querySelector("#room-form")?.dispatchEvent(new Event("input")); } }, "untouchable"),
		el("span", { class: "info" }, `${r.width}×${r.height}`)), frame);

function previewTargets(capture, table, actorTable, relative) {
	const rows = new Map([...table.querySelectorAll("[data-oid]")].map(row => [Number(row.dataset.oid), row]));
	const items = [];
	for (const o of capture.objects) {
		const row = rows.get(o.id);
		if (!row || row.querySelector(".hide").checked || !o.w || !o.h || o.x + o.w <= 0 || o.x >= (capture.room_width || capture.width)) continue;
		const rename = row.querySelector(".rename").value.trim();
		const name = rename || o.name;
		if (!name) continue;
		const x = o.x + Math.floor(o.w / 2);
		const notes = [row.querySelector(".notefield").value.trim()];
		if (relative && capture.ego_x != null)
			notes.push("to " + (journal.game.keys.ego_name || "your character") + (x < capture.ego_x ? "'s left" : "'s right"));
		const note = notes.filter(Boolean).join("; ");
		const item = { name, note, x, state: o.state, usable: o.usable ?? !o.untouchable };
		const duplicate = rename && items.find(t => t.name === name && t.note === note);
		if (!duplicate) items.push(item);
		else if (!duplicate.usable && item.usable) Object.assign(duplicate, item);
	}
	const actorRows = new Map([...actorTable.querySelectorAll("[data-aid]")].map(row => [Number(row.dataset.aid), row]));
	for (const a of capture.actors) {
		const row = actorRows.get(a.id);
		if (!a.visible || a.untouchable || !row || row.querySelector(".hide").checked) continue;
		const name = row.querySelector(".actorname").value.trim() || (journal.actors.keys[a.id] ?? a.name);
		if (name && !name.startsWith("-") && !items.some(t => !t.actor && t.name.toLowerCase() === name.toLowerCase()))
			items.push({ name, x: a.x, usable: true, actor: true, note: "" });
	}
	items.sort((a, b) => a.x - b.x);
	const totals = new Map(), counts = new Map();
	for (const t of items) {
		const key = t.name.toLowerCase();
		totals.set(key, (totals.get(key) || 0) + 1);
	}
	const things = [], people = [];
	for (const t of items) {
		const key = t.name.toLowerCase(), n = (counts.get(key) || 0) + 1;
		counts.set(key, n);
		const state = journal.states.keys[key]?.split(",")[t.state]?.trim();
		const note = [state, t.note].filter(Boolean).join("; ");
		if (t.usable) (t.actor ? people : things).push(t.name + (totals.get(key) > 1 ? " " + n : "") + (note ? " (" + note + ")" : ""));
	}
	return { things, people };
}

			const set = Object.fromEntries(fields.map(([key]) => [key, controls[key].get().trim() || null]));
			const more = note.value.trim() !== (comment || "") ? { comment: note.value } : {};
			if (await saveSection(section, set, more)) redraw("Saved");
		} }, "Save"), keep ? "" : el("button", { class: "small danger", type: "button", onclick: async () => {
			if (confirm(`Delete [${section}] from the file?`) && await deleteSection(section)) redraw("Deleted");
		} }, "delete"), el("span", { class: "note" }, `[${section}]`)));
}
function adder(placeholder, label, make) {
	const id = el("input", { placeholder });
	const add = async () => {
		const clean = id.value.trim().toLowerCase().replace(/[^a-z0-9-]+/g, "-").replace(/^-|-$/g, "");
		if (!clean) return;
		const [section, set] = make(clean);
		openFolds.add(section);
		if (await saveSection(section, set)) { await reloadJournal(); render(); }
	};
	id.addEventListener("keydown", e => { if (e.key === "Enter") add(); });
	return el("div", { class: "addrow" }, id, el("button", { class: "small", type: "button", onclick: add }, label));
}
const triggerGist = value => (value || "").split(" | ").map(t => t.trim()).filter(Boolean).join("  ·  ");

/* ---------- goals, clues and nudges ---------- */
const GAME_FIELDS = [["name", "Name of the game"], ["intro", "Who she plays, for the opening explanation", "area"], ["ego_name", "What the player's character is called"],
	["walk_verb", "Name for walking (Walk to)"], ["give_verb", "Verb that gives one thing to another"], ["open_verb", "Verb that opens a door"],
	["door_open_state", "State label of an open door (open)"], ["door_question", "After she opens a door", "select", [["", "ask \"Go through it?\""], ["no", "do not ask"]]],
	["sentence_line_verb", "Verb slot that is the sentence line", "num"], ["inventory_first_verb", "First inventory button", "num"], ["inventory_slots", "Inventory buttons on screen", "num"],
	["inventory_slot_var", "First variable holding what they show", "num"], ["inventory_up_verb", "Button that scrolls the inventory up", "num"], ["inventory_down_verb", "Button that scrolls it down", "num"]];
const GOAL_FIELDS = [["title", "Short title (the words she uses to ask for its clues)"], ["text", "The goal, as she reads it", "area"], ["start", "Appears when (nothing: there from the beginning)", "triggers"], ["done", "Finished when", "triggers"], ["panel", "In the stream column", "select", [["", "shown"], ["no", "left out"]]]];
const CLUE_FIELDS = [["goal", "Goal", "goal"], ["text", "The clue", "area"], ["when", "Noted when", "triggers"]];
const NUDGE_FIELDS = [["when", "Suggest writing a note when", "triggers"], ["say", "Wording (blank: just says it may be worth a note)", "area"]];
function renderJournal() {
	const list = el("div");
	const clueFold = c => fold("clue." + c.id, [tag("clue", "clue"), gist(c.text), tag(triggerGist(c.when).slice(0, 40) || "no trigger")], () => card("clue." + c.id, CLUE_FIELDS, c));
	const keys = () => [...journal.goals.flatMap(g => ["goal." + g.id, "goalself." + g.id]), ...journal.clues.map(c => "clue." + c.id), ...journal.nudges.map(n => "nudge." + n.id)];
	const bar = searchBar(journalSearch, "Search goals, clues and nudges: any word in the text, a trigger or an id", () => draw(), keys);
	function draw() {
		const q = journalSearch.q.trim().toLowerCase(), out = [];
		let goals = 0, clues = 0;
		for (const g of journal.goals) {
			const mine = journal.clues.filter(c => c.goal === g.id), whole = hit(g, q);
			const shown = whole ? mine : mine.filter(c => hit(c, q));
			if (!whole && !shown.length) continue;
			goals++; clues += shown.length;
			out.push(fold("goal." + g.id, [what(g.title || g.id), gist(g.text), tag(shown.length === mine.length ? `${mine.length} clue${mine.length === 1 ? "" : "s"}` : `${shown.length} of ${mine.length} clues`, "goal")], () => [
				fold("goalself." + g.id, [tag("goal", "goal"), gist(g.text), tag(g.start ? triggerGist(g.start).slice(0, 40) : "from the beginning")], () => card("goal." + g.id, GOAL_FIELDS, g)),
				el("h4", {}, shown.length === mine.length ? `Clues for this goal (${mine.length})` : `Clues matching the search (${shown.length} of ${mine.length})`),
				...shown.map(clueFold),
				adder("id for a new clue, e.g. " + g.id + "-where", "Add a clue", id => ["clue." + id, { goal: g.id, text: "(write the clue)" }]),
			], !!q && !whole));
		}
		const stray = journal.clues.filter(c => !journal.goals.some(g => g.id === c.goal) && hit(c, q));
		const nudges = journal.nudges.filter(n => hit(n, q));
		list.replaceChildren(
			el("h3", {}, `Goals (${journal.goals.length})`), ...out, out.length ? "" : el("p", { class: "note" }, "No goal or clue matches."),
			q ? "" : adder("id for a new goal, e.g. poodles", "Add a goal", id => ["goal." + id, { text: "(describe this goal)" }]),
			stray.length ? el("h3", {}, `Clues whose goal does not exist (${stray.length})`) : "", ...stray.map(clueFold),
			el("h3", {}, `Nudges (${journal.nudges.length})`),
			el("div", { class: "help" }, "Lines that matter much later. She is told once that it may be worth a note; what she writes is up to her."),
			...nudges.map(n => fold("nudge." + n.id, [what(n.id), gist(triggerGist(n.when))], () => card("nudge." + n.id, NUDGE_FIELDS, n))),
			q ? "" : adder("id for a new nudge", "Add a nudge", id => ["nudge." + id, { when: "heard: (words from the line)" }]));
		bar.count(q ? `Showing ${goals} of ${journal.goals.length} goals, ${clues + stray.length} of ${journal.clues.length} clues, ${nudges.length} of ${journal.nudges.length} nudges` : "");
	}
	draw();
	document.getElementById("view").replaceChildren(
		el("h1", {}, "Goals and clues"),
		el("div", { class: "sub" }, "What her journal can show. A goal appears when any of its \"appears when\" triggers happens and is ticked off by any of its \"finished when\" triggers; a clue is noted under its goal when one of its triggers happens. Click a row to open it."),
		bar, list);
}

/* ---------- alerts and the other rules ---------- */
const PRIORITIES = [["", "(not set)"], ["low", "low"], ["medium", "medium"], ["high", "high"], ["critical", "critical"]];
const KINDS = [
	{ list: "alerts", prefix: "alert", title: "Alerts", add: "an alert",
		help: "Moments she must not miss. An alert with a question is sent as a forced yes/no; yes carries out the command at once. One without a question only tells her what happened. In the text, {exit} is where a character who left was last seen, {varN} a game variable, {pickN: one | two} the text for its value.",
		fields: [["room", "Room", "room"], ["when", "When", "when"],
			["say", "What a player watching would have just seen", "area"], ["ask", "The yes/no question (blank: only tell her)"],
			["do", "On yes, do", "", "VERB | TARGET | SECOND TARGET"], ["then", "Then at once", "", "VERB | TARGET | SECOND TARGET"],
			["priority", "Priority", "select", PRIORITIES], ["lead", "Seconds after the moment to act", "num"], ["hold", "Game timer variable to hold", "num"],
			["while", "Only while this game script runs", "", "script N"]],
		summary: a => [what(a.id), tag(a.room ? `${a.room} ${journal.rooms[a.room]?.name || ""}` : "any room"), gist(`${a.when || ""}${a.ask ? "  ·  " + a.ask : "  ·  tells her only"}`)],
		fresh: () => ({ when: "entered", say: "(what she is told)" }) },
	{ list: "watches", prefix: "watch", title: "Watched variables", add: "a watch",
		help: "Things the game shows only as animation and keeps as a number. She is told the text when the variable changes; {value} is the new value.",
		fields: [["var", "Game variable", "num"], ["change", "Speak", "select", [["", "when it goes up"], ["any", "on any change"]]], ["say", "What she is told", "area"]],
		summary: w => [what(w.id), tag(`variable ${w.var || "?"}`), gist(w.say)],
		fresh: () => ({ say: "(what she is told)" }) },
	{ list: "linenotes", prefix: "linenote", title: "Notes on dialogue choices", add: "a note on choices",
		help: "Marks some of the lines she can pick from with a heading (insults she has not heard the comeback to). The numbers come from the game's scripts.",
		fields: [["note", "Heading she sees"], ["while", "While this game script runs", "", "script N"], ["first_verb", "First verb slot", "num"], ["slot_var", "Variable of the first slot", "num"],
			["min", "Lowest value", "num"], ["max", "Highest value", "num"], ["unless_bit", "Skip if this bit is set (first value's bit)", "num"]],
		summary: n => [what(n.id), gist(n.note)],
		fresh: () => ({ note: "(heading)" }) },
	{ list: "presses", prefix: "press", title: "Keys pressed for her", add: "a key press",
		help: "For a screen that only takes the keyboard and that she is not meant to deal with, such as a copy protection question the engine lets any answer pass. The key is pressed again and again while the script runs.",
		fields: [["while", "While this game script runs", "", "script N"], ["key", "Key (ASCII code; 13 is Enter)", "num"], ["every", "Seconds between presses (1)", "num"]],
		summary: p => [what(p.id), tag(`key ${p.key || "?"}`), gist(p.while)],
		fresh: () => ({ while: "script 0", key: "13" }) },
	{ list: "lines", prefix: "line", title: "Speakers set for single lines", add: "a line",
		help: "For a line whose speaker neither the actor nor the text colour settles. These are usually made from the Lines tab.",
		fields: [["speaker", "Speaker (- drops the line)"], ["text", "The line, exactly as it is sent"]],
		summary: l => [what(l.speaker === "-" ? "(dropped)" : l.speaker || "(none)"), gist(l.text)],
		fresh: () => ({ speaker: "-", text: "(the line)" }) },
];
/** A whole section of free keys and values ([states], [actors]). */
function pairsCard(section, data, keyLabel, valueLabel) {
	const rows = rowsEditor([{ key: "key", label: keyLabel, width: "110px" }, { key: "value", label: valueLabel, grow: 2, width: "140px" }],
		Object.entries(data.keys).map(([key, value]) => ({ key, value })), "+ row");
	const note = el("textarea", { class: "short" }, data.comment);
	return el("div", { class: "fields" }, rows, el("label", {}, "Comment in the file", note), el("div", { class: "savebar" }, el("button", { class: "primary", type: "button", onclick: async () => {
		const set = Object.fromEntries(Object.keys(data.keys).map(k => [k, null]));
		for (const row of rows.read()) if (row.key && row.value) set[row.key] = row.value;
		const more = note.value.trim() !== data.comment ? { comment: note.value } : {};
		if (await saveSection(section, set, more)) { await reloadJournal(); render(); flash("Saved"); }
	} }, "Save"), el("span", { class: "note" }, `[${section}]`)));
}
function renderOther() {
	const list = el("div");
	const keys = () => [...KINDS.flatMap(k => journal[k.list].map(item => `${k.prefix}.${item.id}`)), "states", "actors", "synonyms", "game", "roomextras"];
	const bar = searchBar(otherSearch, "Search alerts and rules: any word in the text, a room number or an id", () => draw(), keys);
	function draw() {
		const q = otherSearch.q.trim().toLowerCase(), out = [];
		let shownCount = 0, total = 0;
		for (const kind of KINDS) {
			const all = journal[kind.list], shown = all.filter(item => hit(item, q));
			total += all.length; shownCount += shown.length;
			if (q && !shown.length) continue;
			out.push(el("h3", {}, `${kind.title} (${all.length})`), el("div", { class: "help" }, kind.help),
				...shown.map(item => fold(`${kind.prefix}.${item.id}`, kind.summary(item), () => card(`${kind.prefix}.${item.id}`, kind.fields, item))),
				q ? "" : adder(`id for ${kind.add}`, `Add ${kind.add}`, id => [`${kind.prefix}.${id}`, kind.fresh()]));
		}
		if (!q) {
			const special = Object.entries(journal.rooms).map(([n, keys]) => [n, keys, roomExtras(keys)]).filter(([, , extras]) => extras.length).sort((a, b) => a[0] - b[0]);
			out.push(el("h3", {}, "For the whole game"),
				fold("states", [what("State labels"), gist(Object.keys(journal.states.keys).join(", ")), tag(`${Object.keys(journal.states.keys).length}`)], () => [
					el("div", { class: "help" }, "For things whose look tells her something: a label for each state the game keeps for a thing of that name, in order from state 0 (door = closed, open)."),
					pairsCard("states", journal.states, "thing's name", "labels, separated by commas")]),
				fold("actors", [what("Names for unnamed actors"), gist(Object.entries(journal.actors.keys).map(([k, v]) => `${k} ${v}`).join(", ")), tag(`${Object.keys(journal.actors.keys).length}`)], () => [
					el("div", { class: "help" }, "Used in any room whose own section does not name the actor."),
					pairsCard("actors", journal.actors, "actor number", "name")]),
				fold("synonyms", [what("Other words for verbs"), gist(Object.entries(journal.synonyms.keys).map(([k, v]) => `${k} = ${v}`).join(", ")), tag(`${Object.keys(journal.synonyms.keys).length}`)], () => [
					el("div", { class: "help" }, "Words she may use for a verb, and the verb on screen each stands for. A word that stands for the walk verb means walking."),
					pairsCard("synonyms", journal.synonyms, "her word", "verb on screen")]),
				fold("game", [what("The game"), gist(Object.entries(journal.game.keys).map(([k, v]) => `${k} = ${v}`).join(", ") || "nothing set")], () => [
					el("div", { class: "help" }, "What the game is called, and what the module cannot work out about its screen. The numbers are verb slot ids and variable numbers from the game's scripts."),
					card("game", GAME_FIELDS, journal.game.keys, { comment: journal.game.comment, keep: true })]),
				fold("roomextras", [what("Rooms with settings of their own"), gist("voices, hidden things, places to walk to and the like"), tag(`${special.length}`)], () => [
					el("div", { class: "help" }, "Everything here is edited on the room's own tab; click a room to go there."),
					...special.map(([n, keys, extras]) => el("div", { class: "roomrow", onclick: () => go(+n, "room") },
						el("span", { class: "num" }, n), el("strong", {}, keys.name || "—"), ...extras.map(text => el("span", { class: "chip" }, text))))]));
		}
		list.replaceChildren(...out, out.length ? "" : el("p", { class: "note" }, "Nothing matches."));
		bar.count(q ? `Showing ${shownCount} of ${total}` : "");
	}
	draw();
	document.getElementById("view").replaceChildren(
		el("h1", {}, "Alerts and rules"),
		el("div", { class: "sub" }, "The parts of the description file that are not about one room's text: timed questions, things put into words, and settings for the whole game."),
		bar, list);
}

document.addEventListener("keydown", e => {
	if ((e.ctrlKey || e.metaKey) && e.key === "s") { e.preventDefault(); document.querySelector("form")?.requestSubmit(); return; }
	if (e.key === "Escape" && picking) { picking = null; document.getElementById("picturePane").classList.remove("picking"); }
	if (e.target.matches("input, textarea, select")) return;
	if (e.key === "j") step(1);
	if (e.key === "k") step(-1);
});
load();
</script>
