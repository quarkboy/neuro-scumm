; Descriptions for The Secret of Monkey Island, for a player who cannot see the screen.
; Format: see engines/scumm/neuro/data.h.
;
; Rules for writing these:
;  - Say only what is visible on screen. No solutions, no hints.
;  - Keep a room to two or three sentences.
;  - An object note says what the thing is or where it leads, in a few words.

