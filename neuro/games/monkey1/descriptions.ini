; ---------------------------------------------------------------------------
; Alerts: moments on screen she has to react to quickly.
; ---------------------------------------------------------------------------

; Sword fights: the swords only show who took the last exchange
[watch.exchange-won]
var = 263
say = You won that exchange and drove your opponent back. Exchanges you have won in this fight: {value}.

[watch.exchange-lost]
var = 262
say = You lost that exchange and were driven back. Exchanges you have lost in this fight: {value}.

; Monkey Island, the summit: where the stone lands is only shown as a dot flying
; across the view. Left and right are read off its landing point in the script
; (230 + 7 x the log's position); the wording has not been checked against the picture.
[alert.rock-pushed]
room = 11
when = disappeared: =rock
say = The rock rolled off the edge of the summit and fell onto the log on the ledge below, which flung the stone resting on its other end far out over the island. {pick242: It came down in the sea to the left of the ship. | It came down right on the ship lying at anchor. | It came down between the ship and the big banana tree on the beach. | It came down on the beach by the big banana tree. | It came down a little to the right of the big banana tree on the beach. | It came down well to the right of the big banana tree on the beach. | It came down far to the right of the big banana tree on the beach.} The summit is bare again where the rock stood.

; Feeding the monkey is only shown: it takes the banana and eats it
[watch.monkey-fed]
var = 145
say = The monkey takes the banana and eats it. {pick145: It looks at Guybrush for more. | It looks at Guybrush for more. | It looks at Guybrush for more. | It looks at Guybrush for more. | It comes over to Guybrush and now follows him wherever he goes.}

[watch.log-turned]
var = 242
change = any
say = The log on the ledge has swung round one notch on its rock. It has seven positions and is now in number {value}.

; The gull completes a flight with the fish still on the pier.
[watch.gull-returns]
var = 272
say = The end plank tipped up and sent the seagull flapping into the air. It settles beside the fish again.

[alert.rat-drinks]
room = 74
when = disappeared: =rat 3
say = The big ghost rat turns to the dish. The way past the other rats to the grease is clear.

[alert.cook-out]
room = 28
when = arrived: cook
; Measured from the pirate leaders' table: walking to the kitchen door works
; from 3 seconds after he appears (tried up to 6); sooner and he shouts.
; He leaves the door open, so no "Open" is needed.
lead = 4
priority = high
say = The cook has walked out of the kitchen and across the bar, away from the kitchen door. He left the door open behind him.
ask = Slip through the open kitchen door while he is not looking?
do = Walk to | door 2

[alert.follow-storekeeper-store]
; Leaving his own store he shuts the door behind him
room = 30
when = disappeared: storekeeper
priority = high
hold = 12
say = The storekeeper has walked out of the store and shut the door behind him.
ask = Follow him?
do = Open | door
then = Walk to | door

[alert.follow-storekeeper-lookout]
; He is never shown on this screen: from the dock he turns up next on the island map
room = 38
when = entered
while = script 67
priority = high
hold = 12
say = The storekeeper is not on the lookout point. He must have gone on ahead.
ask = Keep going along the path?
do = Walk to | path

[alert.follow-storekeeper]
; He leads the way to the Sword Master and waits about 30 seconds on each screen
; for her to catch up (timer variable 12), then gives up.
when = left: storekeeper
priority = high
hold = 12
say = The storekeeper has walked off. He was last seen at: {exit}.
ask = Follow him?
do = Walk to | {exit}

[alert.grog-mug]
; The mug's inventory name goes "mug o' grog", "melting mug", "mug near death"
; (names confirmed in the scripts; the timing is unverified). Any room: it happens on the
; way from the SCUMM Bar kitchen to the jail.
when = gained: near death
priority = high
say = The grog has nearly eaten through your mug. In a moment it will be gone.
ask = Pour the grog into a fresh mug?
do = Use | mug near death | =mug

[alert.root-beer]
; unverified: the final fight, at Stan's. LeChuck has punched Guybrush into the
; grog machine and a bottle of root beer lies on the ground.
room = 59
when = appeared: root beer
priority = critical
say = Guybrush is lying by the grog machine. A bottle of root beer has rolled onto the ground next to him, and LeChuck is coming for him.
ask = Grab the root beer and use it on LeChuck?
do = Pick up | root beer
then = Use | root beer | LeChuck

