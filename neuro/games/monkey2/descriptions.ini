; Descriptions for Monkey Island 2: LeChuck's Revenge, for a player who cannot see the screen.
; Format: see engines/scumm/neuro/data.h.

[game]
name = Monkey Island 2: LeChuck's Revenge
intro = You control Guybrush Threepwood, a pirate who is out to find the legendary treasure of Big Whoop.
ego_name = Guybrush
walk_verb = Walk to
give_verb = Give
open_verb = Open
; The sentence line above the verbs is verb slot 100
sentence_line_verb = 100
; The inventory: eight picture buttons from 200, showing the objects in variables
; 134 to 141, with buttons 208 and 209 to scroll a row up and down
inventory_first_verb = 200
inventory_slots = 8
inventory_slot_var = 134
inventory_up_verb = 208
inventory_down_verb = 209

; Words she may use for a verb, and the verb on screen they stand for
[synonyms]
walk = Walk to
go to = Walk to
go = Walk to
move to = Walk to
walk to the = Walk to
enter = Walk to
approach = Walk to
take = Pick up
grab = Pick up
get = Pick up
pickup = Pick up
examine = Look at
inspect = Look at
read = Look at
speak = Talk to
speak to = Talk to
speak with = Talk to
talk with = Talk to
ask = Talk to

[states]
door = closed, open

; The copy protection screen only takes the keyboard. ScummVM lets any answer
; pass, so Enter starts it (script 142 waits for that) and a digit is typed
; for as long as it asks for one (script 136 blinks the cursor meanwhile).
[press.protection_start]
while = script 142
key = 13

[press.protection_code]
while = script 136
key = 49
every = 0.5

