; ---------------------------------------------------------------------------
; Journal goals: only what characters have told her, never how to do it.
; ---------------------------------------------------------------------------

[goal.leaders]
text = The lookout says: if you are serious about becoming a pirate, talk to the pirate leaders in the SCUMM Bar.
start = heard: go talk to the pirate leaders
done = heard: three trials

[goal.trials]
text = To become a pirate, pass the three trials (swordplay, thievery, treasure hunting) and return to the pirate leaders in the SCUMM Bar with proof of each.
start = goal: leaders

[goal.sword]
text = Sword trial: get a sword, find someone to train you, then seek out and defeat the Sword Master. Someone in town can probably direct you.
start = heard: seek out and defeat the Sword Master

[goal.idol]
text = Thievery trial: steal the Idol of Many Hands from its display case in the Governor's mansion outside of town. There are guards, and vicious dogs outside that you might be able to drug.
start = heard: Idol of Many Hands
done = have: idol

[goal.treasure]
text = Treasure trial: find the Legendary Lost Treasure of Mêlée Island and bring it back. You will need a map, and X marks the spot.
start = heard: Legendary Lost Treasure

