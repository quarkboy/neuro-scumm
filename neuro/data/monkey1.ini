[room41]
name = SCUMM Bar kitchen
description = A small, grubby kitchen with blood spattered on the turquoise walls. There is a table in the middle and a big black stove with a pot of stew on it. A door on the right opens onto a short pier over the sea. When that door is open you can see a fish lying on the pier with a seagull standing over it, pecking at it.
spot.far end of the pier = 316,134 | The plank at the end is loose. As you step on it, its other end flips up and startles the seagull into the air. A few seconds later the seagull lands by the fish again.
