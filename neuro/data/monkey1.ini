[room38]
name = Lookout point
description = A rocky ledge high above the sea at night, with a small campfire. An old lookout stands at a low stone wall, staring out over the water.
object.486 = lead down to the dock
object.487 = leads away from town, to the rest of the island

[room33]
name = Dock, outside the SCUMM Bar
description = A wooden dock at night. A crooked tavern with glowing windows stands over the water; the sign above its door reads SCUMM BAR. A cliff rises at the left end of the dock, and a stone archway stands at the right end.
object.426 = path up to the lookout point
object.427 = leads into town
object.428 = entrance to the SCUMM Bar
object.429 = on the wall of the bar

[room28]
name = Inside the SCUMM Bar
description = A dim, noisy pirate tavern. Pirates sit drinking at tables on the left half of the room, and a dog lies on the floor among them. On the right, three important-looking pirates share a table beside a stone fireplace. A red curtain hangs in the middle of the back wall. Now and then the cook comes out of the kitchen, crosses the room and goes back in.
