[room38]
name = Lookout point
description = A rocky ledge high above the sea at night, with a small campfire. An old lookout stands at a low stone wall, staring out over the water.
object.486 = lead down to the dock
object.487 = leads away from town, to the rest of the island

[room33]
name = Dock, outside the SCUMM Bar
description = A wooden dock at night. A crooked tavern with glowing windows stands over the water; the sign above its door reads SCUMM BAR. A cliff rises at the left end of the dock, and a stone archway stands at the right end.
object.426 = path up to the lookout point
object.427 = leads into town
object.428 = entrance to the SCUMM Bar
object.429 = on the wall of the bar

[room28]
name = Inside the SCUMM Bar
description = A dim, noisy pirate tavern. Pirates sit drinking at tables on the left half of the room, and a dog lies on the floor among them. On the right, three important-looking pirates share a table beside a stone fireplace. A red curtain hangs in the middle of the back wall.
object.315 = exit to the dock
object.316 = at the far right, has a round window; leads to the kitchen
actor.6 = cook

[room41]
name = SCUMM Bar kitchen
description = A small, grubby kitchen with blood spattered on the turquoise walls. There is a table in the middle and a big black stove with a pot of stew on it. A door on the right opens onto a short pier over the sea. When that door is open you can see a fish lying on the pier with a seagull standing over it, pecking at it.
spot.far end of the pier = 316,134 | The plank at the end is loose. As you step on it, its other end flips up and startles the seagull into the air. A few seconds later the seagull lands by the fish again.
object.570 = back to the bar
object.564 = out to the pier
object.568 = lying on the pier; the seagull is guarding it
actor.7 = seagull

